[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cheetah-db"
version = "0.1.0"
description = "Python client for cheetah-server: codec, client, KV/graph/job helpers and a subclassable database handle"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../../LICENSE" }
# No runtime dependencies on purpose: the protocol is a socket and newlines.
dependencies = []

[project.urls]
Homepage = "https://github.com/cekkr/cheetah"

[tool.setuptools]
packages = ["cheetah_db"]
