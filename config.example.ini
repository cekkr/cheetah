# Example configuration for cheetah-db. Copy this file to config.ini
# and adjust values as needed. Any setting left unspecified falls back
# to the defaults shown here.
#
# The [database] section holds the *general* per-database defaults. A single
# database can override them for itself: DB_CREATE <name> key=value …,
# DATABASE <name> key=value …, or DB_CONFIG <name> key=value … writes the tokens to
# <data_dir>/<name>/settings.ini, which is re-read at every open and applied on
# top of this file. DB_LIST reports the resulting settings per database.

[server]
listen_addr = 0.0.0.0:4455
data_dir = cheetah_data
default_database = default

# Process-wide ceiling shared by the derived association caches of every
# loaded database. Each database's graph_cache_capacity below remains its own
# smaller ceiling. 0 disables only the global ceiling.
graph_cache_global_capacity = 65536

[database]
# Each trie node indexes this many bytes at once (1 or 2). Increasing
# the stride shrinks tree depth but enlarges every dense PairTable file.
pair_index_bytes = 1

# Optional adaptive main-key sharding. It starts with one randomly chosen slot
# and activates another only while every active slot is leased by a concurrent
# insert. Each slot owns main_keys_<slot>.table plus its recycle file, keeping
# row offsets dense inside every file. Keys remain inside the pair trie's
# existing 48-bit absolute-key envelope: with the default 12 slot bits this is
# 4,096 slots of 2^36 rows each. Both values are pinned at creation in
# main_keys.format.dat; changing them requires RESET_DB.
sharded_key_slots = false
key_slot_bits = 12

# Adaptive per-node indexing. When enabled (default), a sparse trie node is
# stored as a compact binary-searched sorted list and only expands into a
# direct-mapped array once it grows past pair_list_max_bytes. This keeps
# sparse 2-byte-stride nodes from preallocating ~707 KB each.
#
# A node only uses a list when its dense array would exceed pair_list_max_bytes.
# A 1-byte-stride node is 2,828 bytes — already inside a single filesystem block
# — so it is dense from creation regardless of this setting; in practice the list
# container applies to 2-byte-stride nodes only.
#
# Disable to force every node to the dense array from creation (legacy profile).
# The choice and stride are pinned per database at creation (pairs/format.dat);
# switching them requires RESET_DB to rebuild.
adaptive_pair_index = true

# Payload cache sizing. Set to 0 to disable caching.
payload_cache_entries = 16384
payload_cache_mb = 64

# Derived graph-association cache. These values can be changed live with
# DB_CONFIG or GRAPH_CACHE config and are persisted in the database's
# settings.ini. CHEETAH_GRAPH_CACHE=0 changes the server-wide enabled default.
graph_cache_enabled = true
graph_cache_sample = 0.25
graph_cache_capacity = 65536
graph_cache_half_life = 6h
graph_cache_min_utility = 0.05
graph_cache_budget = 64
graph_cache_interval = 15s
graph_cache_page = 256

[tuning]
# Override the maximum number of simultaneously cached PairTable files.
# When omitted, cheetah-db uses RLIMIT_NOFILE less a proportional eighth
# (minimum 128), clamped to [64, 65536]; the reserve covers the jump store,
# sockets and the runtime. Lowering this is rarely a win — the handle cache
# pays for itself, and starving it makes open(2) the dominant cost. Prefer
# raising the process fd limit over pinning a small value here.
max_pair_tables = 8192

# Sorted-list byte budget at which an adaptive node densifies into a
# direct-mapped array. Also decides which nodes use a list at all: a node whose
# dense array already fits in this budget is dense from creation. Only
# meaningful when adaptive_pair_index = true.
pair_list_max_bytes = 4096

# Optional extra densify cap, as a percentage of a node's branch capacity.
# 0 (default) disables it, leaving pair_list_max_bytes as the only trigger.
# Only applies to nodes that use a list at all (2-byte stride), and at the
# default byte budget it never binds — raise pair_list_max_bytes first if you
# want this to take effect.
pair_list_max_fill_percent = 0
